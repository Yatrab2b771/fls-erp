# Netlify build config for the monorepo. Deliberately NOT using `base` to
# scope into apps/web — this is an npm-workspaces monorepo, and installing
# from inside apps/web alone would miss the hoisted root install (Prisma
# types etc. aren't relevant to the web app, but the workspace symlinks
# npm sets up at the root are). Install and build from the repo root
# instead, publish apps/web's build output.
[build]
  command = "npm ci && npm run build:web"
  publish = "apps/web/dist"

# React Router (client-side routing) — every path must fall back to
# index.html so a hard refresh on e.g. /purchase-orders/123 doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
